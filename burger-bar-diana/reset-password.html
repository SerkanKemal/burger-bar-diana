<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Нова парола | Burger Bar Diana</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <img src="images/brand-logo.svg" alt="Burger Bar & Bagel Diana">
    <div><h1>Задаване на нова парола</h1><a href="/">Към сайта</a></div>
  </header>
  <main>
    <form id="resetPasswordForm" class="password-reset-form">
      <label>Нова парола<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Повтори паролата<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit">Смени паролата</button>
    </form>
    <p id="resetMessage" aria-live="polite"></p>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
