<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Управление на поръчки | Burger Bar Diana</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <img src="images/brand-logo.svg" alt="Burger Bar & Bagel Diana">
    <div><h1>Управление на поръчки</h1><a href="/">Към сайта</a></div>
  </header>
  <main>
    <form id="adminLogin">
      <label>Имейл<input name="email" type="email" autocomplete="email" required></label>
      <label>Парола<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Вход за администратор</button>
    </form>
    <div class="admin-actions">
      <div>
        <p id="adminMessage" aria-live="polite">Влез с администраторския профил.</p>
        <small id="refreshCountdown">Автоматичното обновяване ще започне след вход.</small>
      </div>
      <button id="refreshOrders" type="button">Обнови</button>
      <button id="exportOrders" type="button" hidden>Изтегли CSV</button>
      <button id="adminLogout" type="button" hidden>Изход</button>
    </div>
    <nav class="order-filters" id="orderFilters" aria-label="Филтри за поръчките" hidden>
      <button class="active" type="button" data-filter="active">Активни</button>
      <button type="button" data-filter="today">Днес</button>
      <button type="button" data-filter="this-week">Тази седмица</button>
      <button type="button" data-filter="previous-week">Предната седмица</button>
      <button type="button" data-filter="completed">Приключени</button>
      <button type="button" data-filter="all">Всички</button>
    </nav>
    <section id="adminOrders" class="orders-grid"></section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
